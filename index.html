<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        input[type="text"] {
            width: 60%;
            max-width: 400px;
            padding: 0.5rem;
            font-size: 1rem;
        }

        button {
            padding: 0.5rem 1rem;
            font-size: 1rem;
            cursor: pointer;
        }

        img {
            margin-top: 1rem;
            max-width: 100%;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Image Generator</h1>
        <input type="text" id="promptInput" placeholder="Enter a prompt">
        <button onclick="generateImage()">Generate</button>
        <br>
        <img id="generatedImage" style="display: none;" alt="Generated Image">
    </div>

    <script>
        async function generateImage() {
            const prompt = document.getElementById("promptInput").value;
            if (!prompt) {
                alert("Please enter a prompt!");
                return;
            }

            // Call the FastAPI backend
            const response = await fetch(`/generate-image?prompt=${encodeURIComponent(prompt)}`);
            
            if (!response.ok) {
                alert("Failed to generate image. Please try again.");
                return;
            }

            // Convert response to blob and create an object URL
            const imageBlob = await response.blob();
            const imageUrl = URL.createObjectURL(imageBlob);

            // Display the image
            const imgElement = document.getElementById("generatedImage");
            imgElement.src = imageUrl;
            imgElement.style.display = "block";
        }
    </script>
</body>
</html>
